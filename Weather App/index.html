
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@200;300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="dashboard-wrap">
        <!-- Top Section: Location & Date -->
        <header class="top-section fade-in-up">
            <div class="location-selector" id="search-container">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path>
                    <circle cx="12" cy="10" r="3"></circle>
                </svg>
                <input type="text" id="city-search" class="search-input" placeholder="Search city..." autocomplete="off" value="Brooklyn, New York, USA">
                <div class="search-dropdown" id="search-dropdown">
                    <!-- Search results injected here -->
                </div>
            </div>
            <div class="date-text" id="current-date"></div>
        </header>

        <!-- Main Content Area Grid -->
        <main class="main-content">
            <!-- Left Section: Current Weather Text -->
            <section class="current-weather fade-in-up" style="--delay: 0.1s">
                <div class="temperature">
                    <span class="temp-value" id="current-temp">16</span>
                    <span class="temp-unit">°C</span>
                </div>
                <div class="condition" id="current-condition">Storm with Rain</div>
                
                <div class="weather-meta">
                    <div class="meta-item">
                        <div class="meta-label">
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M9.59 4.59A2 2 0 1 1 11 8H2m10.59 11.41A2 2 0 1 0 14 16H2m15.73-8.27A2.5 2.5 0 1 1 19.5 12H2"></path>
                            </svg>
                            Wind
                        </div>
                        <div class="meta-value" id="current-wind">2.4km/h</div>
                    </div>
                    <div class="meta-item">
                        <div class="meta-label">
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M12 2.69l5.66 5.66a8 8 0 1 1-11.31 0z"></path>
                            </svg>
                            Humidity
                        </div>
                        <div class="meta-value" id="current-humidity">70%</div>
                    </div>
                </div>
            </section>

            <!-- Center Section: Weather Illustration -->
            <section class="weather-illustration fade-in-up" style="--delay: 0.2s">
                <div class="illustration-container">
                    <!-- High-quality SVG assets will be referenced or embedded here. -->
                    <div class="animated-cloud">
                        <svg class="cloud-svg" viewBox="0 0 200 120" xmlns="http://www.w3.org/2000/svg">
                            <defs>
                                <linearGradient id="cloudGrad" x1="0%" y1="0%" x2="0%" y2="100%">
                                    <stop offset="0%" stop-color="#ffffff"/>
                                    <stop offset="70%" stop-color="#f0f0f0"/>
                                    <stop offset="100%" stop-color="#d0d0d0"/>
                                </linearGradient>
                                <radialGradient id="cloudGlow" cx="50%" cy="80%" r="50%">
                                    <stop offset="0%" stop-color="rgba(255, 184, 0, 0.5)"/>
                                    <stop offset="100%" stop-color="rgba(255, 184, 0, 0)"/>
                                </radialGradient>
                                <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
                                    <feDropShadow dx="0" dy="10" stdDeviation="15" flood-opacity="0.2"/>
                                </filter>
                            </defs>
                            <!-- Ambient Glow behind lightning -->
                            <ellipse cx="140" cy="80" rx="40" ry="20" fill="url(#cloudGlow)"/>
                            <!-- Multi-layered cloud path for 3D depth -->
                            <path d="M 50 85 
                                     C 30 85, 15 70, 20 50
                                     C 20 30, 40 20, 55 35
                                     C 60 10, 100 0, 120 25
                                     C 150 15, 180 30, 180 60
                                     C 190 80, 170 95, 150 90
                                     C 150 95, 60 95, 50 85 Z" 
                                  fill="url(#cloudGrad)" filter="url(#shadow)"/>
                            <!-- Front subtle highlight -->
                            <path d="M 60 40 C 70 20, 100 15, 110 30" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" opacity="0.6"/>
                        </svg>
                    </div>
                    <div class="lightning-wrapper">
                        <svg class="lightning-svg" viewBox="0 0 40 80" xmlns="http://www.w3.org/2000/svg">
                            <defs>
                                <filter id="lightningGlow" x="-50%" y="-50%" width="200%" height="200%">
                                    <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
                                    <feMerge>
                                        <feMergeNode in="coloredBlur"/>
                                        <feMergeNode in="SourceGraphic"/>
                                    </feMerge>
                                </filter>
                                <linearGradient id="lightGrad" x1="0%" y1="0%" x2="0%" y2="100%">
                                    <stop offset="0%" stop-color="#FFDD66"/>
                                    <stop offset="50%" stop-color="#FFB800"/>
                                    <stop offset="100%" stop-color="#FF8800"/>
                                </linearGradient>
                            </defs>
                            <path d="M 25 5 L 5 45 L 20 45 L 15 75 L 35 30 L 20 30 Z" fill="url(#lightGrad)" filter="url(#lightningGlow)"/>
                        </svg>
                    </div>
                </div>
            </section>

            <!-- Right Section: Forecast Card -->
            <section class="forecast-section fade-in-up" style="--delay: 0.3s">
                <div class="forecast-card glass-panel">
                    <ul class="forecast-list" id="forecast-list">
                        <!-- Items dynamically injected or statically placed for now -->
                        <li class="forecast-item active">
                            <svg class="weather-icon" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M20 16.2A4.5 4.5 0 0 0 17.5 8h-1.8A7 7 0 1 0 4 14.9"></path>
                                <path d="M16 14v6"></path>
                                <path d="M8 14v6"></path>
                                <path d="M12 16v6"></path>
                            </svg>
                            <div class="forecast-info">
                                <div class="day-name">Friday</div>
                                <div class="condition-sm">Cloudy with rain</div>
                            </div>
                            <div class="forecast-temp">18°</div>
                        </li>
                        <li class="forecast-item">
                            <svg class="weather-icon" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                                <circle cx="12" cy="12" r="5"></circle>
                                <line x1="12" y1="1" x2="12" y2="3"></line>
                                <line x1="12" y1="21" x2="12" y2="23"></line>
                                <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
                                <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
                                <line x1="1" y1="12" x2="3" y2="12"></line>
                                <line x1="21" y1="12" x2="23" y2="12"></line>
                                <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
                                <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
                            </svg>
                            <div class="forecast-info">
                                <div class="day-name">Saturday</div>
                                <div class="condition-sm">Sunny</div>
                            </div>
                            <div class="forecast-temp">28°</div>
                        </li>
                        <li class="forecast-item">
                            <svg class="weather-icon" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M12 22a5 5 0 0 0 5-5c0-2-5-10-5-10S7 15 7 17a5 5 0 0 0 5 5z"></path>
                            </svg>
                            <div class="forecast-info">
                                <div class="day-name">Sunday</div>
                                <div class="condition-sm">Rain</div>
                            </div>
                            <div class="forecast-temp">22°</div>
                        </li>
                    </ul>
                </div>
            </section>
        </main>

        <!-- Bottom Section: Hourly Timeline Graph -->
        <footer class="bottom-section fade-in-up" style="--delay: 0.4s">
            <div class="timeline-container">
                <svg class="graph-svg" preserveAspectRatio="none" viewBox="0 0 1000 150">
                    <path class="graph-line" d="M 50 100 Q 150 120 250 90 T 450 70 T 650 110 T 850 60" fill="none" stroke="#fff" stroke-width="1.5"/>
                    <!-- Data points (dots) will go here -->
                </svg>
                <div class="timeline-labels" id="timeline-labels">
                    <!-- Hourly item template -->
                </div>
            </div>
            
            <div class="controls">
                <button class="nav-btn prev-btn">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <polyline points="15 18 9 12 15 6"></polyline>
                    </svg>
                </button>
                <button class="nav-btn next-btn">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <polyline points="9 18 15 12 9 6"></polyline>
                    </svg>
                </button>
            </div>
        </footer>
    </div>
    <script src="script.js"></script>
</body>
</html>
